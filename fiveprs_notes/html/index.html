<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="notes">
    <header class="notes-head">
      <div>
        <h1>Notes</h1>
        <p id="who" class="muted"></p>
      </div>
      <span id="status" class="muted"></span>
    </header>
    <textarea id="text" spellcheck="false" placeholder="Plates, names, anything you need to remember…"></textarea>
    <footer class="notes-foot">
      <span id="count" class="muted"></span>
      <button id="save" type="button">Save</button>
    </footer>
  </main>
  <script src="https://cfx-nui-fiveprs/nui/app-sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
