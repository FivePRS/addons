name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: zip -r "fiveprs_addons-${GITHUB_REF_NAME#v}.zip" "[fiveprs_addons]"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "fiveprs_addons-${GITHUB_REF_NAME#v}.zip" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "fiveprs_addons-${GITHUB_REF_NAME#v}.zip" --title "FivePRS Addons ${GITHUB_REF_NAME#v}" --generate-notes $flags
          fi
